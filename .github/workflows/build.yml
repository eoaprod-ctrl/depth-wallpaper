name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            base64 -d signing/release.jks.b64 > "$RUNNER_TEMP/release.jks"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
          KEY_ALIAS: depthwall
        shell: bash
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] && [ -f signing/password.txt ]; then
            export KEYSTORE_PASSWORD="$(cat signing/password.txt)"
          fi
          gradle --no-daemon :app:assembleRelease 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0
          cp app/build/outputs/apk/release/app-release.apk depth-wallpaper.apk

      - name: Save build log to a branch for diagnosis
        if: failure()
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan build-logs
          git rm -rq --cached . || true
          tail -n 300 build.log > last-build.log
          git add -f last-build.log
          git commit -qm "build log ${{ github.run_number }}"
          git push -f origin build-logs

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: רקע עומק 1.0.${{ github.run_number }}
          make_latest: true
          files: depth-wallpaper.apk
